<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e6e6e9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Reserva | Finanças</title>
<script src="js/config.js?v=5"></script>
<script src="js/auth.js?v=5"></script>
<script>AUTH.requireAuth();</script>
<script src="js/theme.js?v=5"></script>
<script src="js/pwa.js?v=5"></script>
<link rel="stylesheet" href="css/app.css?v=5">
<script src="js/store.js?v=5"></script>
<script src="js/layout.js?v=5"></script>
</head>
<body>
<div class="app">
  <script>UI.sidebar('reserva');</script>
  <main class="main">
    <script>UI.topbar('Reserva e poupança', { mes: true });</script>

    <section class="stat-grid">
      <div class="stat-card is-accent">
        <div class="stat-icon"><svg class="icon"><use href="#i-cofre"/></svg></div>
        <div><div class="stat-value" id="cSaldo">—</div><div class="stat-label" id="cSaldoRot">Saldo guardado</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon is-blue"><svg class="icon"><use href="#i-alvo"/></svg></div>
        <div><div class="stat-value" id="cPct">—</div><div class="stat-label">da meta atingida</div><div class="stat-sub" id="cPctSub"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon is-green"><svg class="icon"><use href="#i-entrada"/></svg></div>
        <div><div class="stat-value" id="cAportado">—</div><div class="stat-label" id="cAportadoRot">Aportado no ano</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg class="icon"><use href="#i-seta"/></svg></div>
        <div><div class="stat-value" id="cRend">—</div><div class="stat-label" id="cRendRot">Rendimentos no ano</div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h3>Meta e rendimento</h3></div>
      <form class="form-grid form-linha" id="formConfig" novalidate>
        <label class="field"><span>Meta da reserva (R$)</span><input name="meta" inputmode="numeric" data-dinheiro autocomplete="off"></label>
        <label class="field"><span>Rendimento mensal (%)</span><input name="rendimento" inputmode="decimal"><span class="field-hint">Ex.: 0,5 (≈ poupança). 1% ao mês ≈ 12,7% ao ano.</span></label>
      </form>
      <div class="progresso-meta"><div class="barra-trilho"><div class="barra-cheia is-verde" id="barraMeta"></div></div><span id="faltaMeta"></span></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h3 id="anoTitulo">Aportes</h3><span class="panel-sub">Digite o aporte de cada mês — o resto é calculado</span></div>
      <div class="report-table-wrap"><table class="report-table tabela-reserva" id="tabela"></table></div>
    </section>
  </main>
</div>
<script src="js/reserva.js?v=5"></script>
</body>
</html>
